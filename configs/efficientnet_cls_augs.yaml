mode: train
defaults:
  - model: efficientnet
  - datasets:
      - inbreast_cls
      - vindr_cls
      - cmmd_cls
      - cbis_cls
  - transforms: simple_augs

  - run: classification
  - _self_


transforms:
  augmentations:
    Normalize:
      mean: [0.1216, 0.1216, 0.1216]
      std: [0.2300, 0.2300, 0.2300]


run:
  num_epochs: 65
  batch_size: 90
  workers: 16
  metrics_shared_kwargs:
    task: binary
  optimizer:
    kwargs:
      lr: 0.0001
  scheduler:
    type: StepLR
    track_metric: null
    kwargs:
      gamma: 0.5
      step_size: 20
