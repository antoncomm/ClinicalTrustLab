mode: test
defaults:
  - model: efficientnet
  - datasets:
    - inbreast_cls
    - vindr_cls
    - cmmd_cls
    - cbis_cls
  - transforms: simple_augs
  - attack: universal_error

  - run: classification
  - _self_


transforms:
  augmentations:
    Normalize:
      mean: [0.1217, 0.1217, 0.1217]
      std: [0.2299, 0.2299, 0.2299]


run:
  num_epochs: 1
  batch_size: 40
  workers: 16
  metrics_shared_kwargs:
    task: binary
  optimizer:
    kwargs:
      lr: 0.0001
  scheduler:
    type: StepLR
    track_metric: null
    kwargs:
      gamma: 0.5
      step_size: 20